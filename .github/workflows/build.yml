name: Build Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore Clean XML Files
        run: python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode("")); open("app/src/main/res/layout/activity_main.xml","wb").write(base64.b64decode("@@K2lkL2FkVmlldyIKICAgICAgICBhbmRyb2lkOmxheW91dF93aWR0aD0ibWF0Y2hfcGFyZW50IgogICAgICAgIGFuZHJvaWQ6bGF5b3V0X2hlaWdodD0id3JhcF9jb250ZW50IgogICAgICAgIGFkczphZFNpemU9IkJBTk5FUiIKICAgICAgICBhZHM6YWRVbml0SWQ9ImNhLWFwcC1wdWItMzk0MDI1NjA5OTk0MjU0NC82MzAwOTc4MTExIiAvPgo8L0xpbmVhckxheW91dD4="))'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and AAB
        run: echo "android.useAndroidX=true" >> gradle.properties && gradle assembleDebug bundleRelease
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
