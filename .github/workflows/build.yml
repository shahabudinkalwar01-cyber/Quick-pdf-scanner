name: Build Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Clean UI & XML Files
        run: |
          mkdir -p app/src/main/res/menu app/src/main/res/drawable
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode("")); open("app/src/main/res/layout/activity_main.xml","wb").write(base64.b64decode("")); open("app/src/main/res/menu/bottom_menu.xml","wb").write(base64.b64decode("")); open("app/src/main/res/drawable/ic_big_doc.xml","wb").write(base64.b64decode("")); open("app/src/main/res/drawable/ic_nav_home.xml","wb").write(base64.b64decode("")); open("app/src/main/res/drawable/ic_nav_history.xml","wb").write(base64.b64decode("")); open("app/src/main/res/xml/file_paths.xml","wb").write(base64.b64decode("PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHBhdGhzPgogICAgPGZpbGVzLXBhdGggbmFtZT0ic2Nhbm5lZF9wZGZzIiBwYXRoPSJTY2FubmVkUERGcy8iIC8+CjwvcGF0aHM+"))'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and AAB
        run: echo "android.useAndroidX=true" >> gradle.properties && gradle assembleDebug bundleRelease
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          files: |
            app/build/outputs/apk/debug/app-debug.apk
