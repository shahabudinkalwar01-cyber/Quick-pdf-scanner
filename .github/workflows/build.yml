name: Build Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Repair XML Links
        run: python3 -c 'import glob,re; u="http"+"://"+"schemas."+"android."+"com/apk/res/"; [open(f,"w").write(re.sub(r"xmlns:ads=\"[^\"]*\"",f"xmlns:ads=\"{u}auto\"",re.sub(r"xmlns:app=\"[^\"]*\"",f"xmlns:app=\"{u}auto\"",re.sub(r"xmlns:android=\"[^\"]*\"",f"xmlns:android=\"{u}android\"",open(f).read())))) for f in glob.glob("app/src/main/**/*.xml",recursive=True)]'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and AAB
        run: echo "android.useAndroidX=true" >> gradle.properties && gradle assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPDFScanner-Files
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
