name: Build Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix XML Headers
        run: |
          python3 -c 'import glob; u="http"+"://"+"schemas."+"android."+"com/apk/res/"; [open(f,"w").write(open(f).read().replace("xmlns:android=\"\"","xmlns:android=\""+u+"android\"").replace("xmlns:app=\"\"","xmlns:app=\""+u+"auto\"").replace("xmlns:ads=\"\"","xmlns:ads=\""+u+"auto\"")) for f in glob.glob("app/src/main/**/*.xml",recursive=True)]'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and AAB
        run: echo "android.useAndroidX=true" >> gradle.properties && gradle assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPDFScanner-Files
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
